services:
  - type: web
    name: pharmacy-shift-kintai
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
