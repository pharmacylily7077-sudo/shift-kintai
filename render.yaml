services:
  - type: web
    name: pharmacy-shift-kintai
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    disk:
      name: kintai-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8080
      - key: SECRET_KEY
        generateValue: true

