<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}薬局シフト勤怠・給与管理システム{% endblock %}</title>
  
  <!-- スマホアプリ化（PWA）対応メタタグ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="薬局勤怠">
  <meta name="theme-color" content="#059669">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pharmacy: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- カスタムスタイル -->
  <link rel="stylesheet" href="/static/css/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

  <!-- ナビゲーションバー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs no-print">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-100">
          <i data-lucide="cross" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-slate-900 tracking-tight">シフト・勤怠・給与</h1>
          <p class="text-xs text-emerald-600 font-medium">ひまわり調剤薬局</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        {% if user %}
          <div class="hidden sm:flex items-center bg-slate-100 px-3 py-1.5 rounded-full text-xs font-medium text-slate-700 space-x-2">
            <span class="w-2 h-2 rounded-full {% if user.role == 'admin' %}bg-purple-500{% else %}bg-emerald-500{% endif %}"></span>
            <span id="header-user-name">{{ user.full_name }}</span>
            <span class="text-slate-400">|</span>
            <span class="text-slate-500">{% if user.role == 'admin' %}管理者{% else %}スタッフ{% endif %}</span>
          </div>

          {% if user.role == 'admin' %}
            <a href="/admin" class="text-xs font-semibold text-purple-700 bg-purple-50 hover:bg-purple-100 border border-purple-200 px-3 py-1.5 rounded-lg flex items-center space-x-1 transition">
              <i data-lucide="shield-check" class="w-4 h-4"></i>
              <span class="hidden sm:inline">管理者画面</span>
            </a>
          {% endif %}

          <button onclick="logout()" class="text-xs font-medium text-slate-600 hover:text-red-600 hover:bg-red-50 p-2 sm:px-3 sm:py-1.5 rounded-lg border border-transparent hover:border-red-100 transition flex items-center space-x-1" title="ログアウト">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span class="hidden sm:inline">ログアウト</span>
          </button>
        {% endif %}
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- トースト通知コンテナ -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- Lucide初期化と共通スクリプト -->
  <script>
    lucide.createIcons();

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const isSuccess = type === 'success';
      toast.className = `transform transition-all duration-300 ease-out translate-y-2 opacity-0 pointer-events-auto flex items-center space-x-2 px-4 py-3 rounded-xl shadow-lg text-sm font-medium ${
        isSuccess ? 'bg-emerald-800 text-white shadow-emerald-200' : 'bg-rose-600 text-white shadow-rose-200'
      }`;
      toast.innerHTML = `
        <i data-lucide="${isSuccess ? 'check-circle' : 'alert-circle'}" class="w-5 h-5 flex-shrink-0"></i>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons({ root: toast });

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    async function logout() {
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/login';
      } catch (e) {
        window.location.href = '/login';
      }
    }

    // PWA Service Worker 登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((reg) => console.log('ServiceWorker registered:', reg.scope))
          .catch((err) => console.log('ServiceWorker registration failed:', err));
      });
    }
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
