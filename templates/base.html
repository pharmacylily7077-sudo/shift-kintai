<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}薬局スタッフプラットフォーム{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Shippori+Mincho:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pharmacist: { dark: '#16a34a', light: '#86efac' },
            clerk:      { dark: '#2563eb', light: '#93c5fd' },
            assistant:  { dark: '#dc2626', light: '#fca5a5' },
          }
        }
      }
    }
  </script>
</head>
<body class="h-full bg-slate-50 text-slate-900">
  {% block body %}{% endblock %}

  <script>
    // Lucideアイコン初期化
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });

    // トースト通知
    function showToast(msg, type = 'success') {
      const colors = {
        success: 'bg-emerald-600',
        error: 'bg-rose-600',
        info: 'bg-blue-600',
      };
      const t = document.createElement('div');
      t.className = `fixed top-4 right-4 z-[9999] px-5 py-3 rounded-2xl text-white text-sm font-semibold shadow-xl ${colors[type] || colors.success} transition-all duration-300`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
    }
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
