{% extends "base.html" %}

{% block title %}ログイン - 薬局シフト勤怠・給与管理システム{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 sm:my-12">
  <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-100">
    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-3">
        <i data-lucide="lock" class="w-7 h-7"></i>
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">ログイン</h2>
      <p class="text-sm text-slate-500 mt-1">IDとパスワードを入力してください</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">ログインID</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="user" class="w-5 h-5"></i>
          </span>
          <input type="text" id="username" required
            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition"
            placeholder="例: staff01">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">パスワード</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="key" class="w-5 h-5"></i>
          </span>
          <input type="password" id="password" required
            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm transition"
            placeholder="••••••••">
        </div>
      </div>

      <div id="error-message" class="hidden text-xs text-rose-600 bg-rose-50 border border-rose-100 p-3 rounded-xl"></div>

      <button type="submit" id="login-btn"
        class="w-full py-3.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-md shadow-emerald-200 hover:shadow-lg transition flex items-center justify-center space-x-2">
        <span>ログインする</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <!-- テスト用クイックログイン支援ボタン（初心者にやさしい設計） -->
    <div class="mt-8 pt-6 border-t border-slate-100">
      <p class="text-xs text-slate-400 font-medium mb-3 text-center">ワンタップでテスト入力（お試し用）</p>
      <div class="grid grid-cols-1 gap-2 sm:grid-cols-3">
        <button type="button" onclick="fillCredentials('staff01', 'staff123')"
          class="text-left px-3 py-2 rounded-xl bg-slate-50 hover:bg-emerald-50 border border-slate-200 hover:border-emerald-200 transition group">
          <div class="text-xs font-bold text-slate-700 group-hover:text-emerald-700">佐藤 (薬剤師)</div>
          <div class="text-[10px] text-slate-400">staff01</div>
        </button>
        <button type="button" onclick="fillCredentials('staff02', 'staff123')"
          class="text-left px-3 py-2 rounded-xl bg-slate-50 hover:bg-emerald-50 border border-slate-200 hover:border-emerald-200 transition group">
          <div class="text-xs font-bold text-slate-700 group-hover:text-emerald-700">田中 (パート)</div>
          <div class="text-[10px] text-slate-400">staff02</div>
        </button>
        <button type="button" onclick="fillCredentials('admin', 'admin123')"
          class="text-left px-3 py-2 rounded-xl bg-slate-50 hover:bg-purple-50 border border-slate-200 hover:border-purple-200 transition group">
          <div class="text-xs font-bold text-slate-700 group-hover:text-purple-700">三宅 興之 (管理者)</div>
          <div class="text-[10px] text-slate-400">admin</div>
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  function fillCredentials(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errBox = document.getElementById('error-message');
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;

    errBox.classList.add('hidden');
    btn.disabled = true;
    btn.classList.add('opacity-75');

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || 'ログインに失敗しました');
      }

      showToast(`ようこそ、${data.full_name} さん！`);
      setTimeout(() => {
        if (data.role === 'admin') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/';
        }
      }, 500);

    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.classList.remove('opacity-75');
    }
  }
</script>
{% endblock %}
